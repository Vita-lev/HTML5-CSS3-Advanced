<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home work 02</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: linear-gradient(135deg, #fff4d6, #d8f3dc);
      }

      .animation-area {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      .shape {
        position: absolute;
        top: calc(50% - 50px);
        left: 0;
        width: 100px;
        height: 100px;
        background: #ff6b35;
        animation: move-and-change 10s linear infinite;
      }

      @keyframes move-and-change {
        0% {
          width: 100px;
          height: 100px;
          border-radius: 0;
          transform: translateX(0);
        }

        30% {
          width: 180px;
          height: 70px;
          border-radius: 0;
          transform: translateX(30vw);
        }

        60% {
          width: 100px;
          height: 100px;
          border-radius: 50%;
          transform: translateX(60vw);
        }

        90% {
          width: 70px;
          height: 180px;
          border-radius: 0;
          transform: translateX(90vw);
        }

        100% {
          width: 100px;
          height: 100px;
          border-radius: 0;
          transform: translateX(calc(100vw - 100px));
        }
      }
    </style>
  </head>
  <body>
    <main class="animation-area">
      <div class="shape"></div>
    </main>
  </body>
</html>
