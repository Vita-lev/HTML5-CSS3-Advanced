<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Завдання 02</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #eef8fc;
        color: #174a63;
      }

      .page {
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
      }

      h1 {
        margin: 0 0 16px;
        text-align: center;
      }

      ol {
        margin: 0 0 32px;
        padding-left: 24px;
        line-height: 1.6;
      }

      /* Поле 400x400. Круг 80x80. Щоб стати в протилежний кут: 400 - 80 = 320 */
      .board {
        position: relative;
        width: 400px;
        height: 400px;
        margin: 0 auto;
        border: 3px solid #00bbff;
        background: #fff;
      }

      .circle {
        position: absolute;
        width: 80px;
        height: 80px;
        border: 4px solid #292626;
        border-radius: 50%;
        animation-duration: 4s;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }

      .circle-blue {
        top: 0;
        left: 0;
        background: #00aeff;
        animation-name: move-right;
      }

      .circle-yellow {
        top: 0;
        left: 320px;
        background: #eaac04;
        animation-name: move-down;
      }

      .circle-red {
        top: 320px;
        left: 320px;
        background: #f72904;
        animation-name: move-left;
      }

      .circle-green {
        top: 320px;
        left: 0;
        background: #05f862;
        animation-name: move-up;
      }

      /* 0–50% = 2 секунди рух, 50–100% = 2 секунди пауза */
      @keyframes move-right {
        0% {
          left: 0;
        }

        50%,
        100% {
          left: 320px;
        }
      }

      @keyframes move-down {
        0% {
          top: 0;
        }

        50%,
        100% {
          top: 320px;
        }
      }

      @keyframes move-left {
        0% {
          left: 320px;
        }

        50%,
        100% {
          left: 0;
        }
      }

      @keyframes move-up {
        0% {
          top: 320px;
        }

        50%,
        100% {
          top: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>Завдання 02</h1>

      <ol>
        <li>Лівий верхній круг їде праворуч.</li>
        <li>Правий верхній круг їде вниз.</li>
        <li>Правий нижній круг їде ліворуч.</li>
        <li>Лівий нижній круг їде вгору.</li>
        <li>Після руху всі круги стоять 2 секунди.</li>
      </ol>

      <div class="board">
        <div class="circle circle-blue"></div>
        <div class="circle circle-yellow"></div>
        <div class="circle circle-red"></div>
        <div class="circle circle-green"></div>
      </div>
    </main>
  </body>
</html>
