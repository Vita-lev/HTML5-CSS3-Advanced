<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowerlover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <a class="header__logo" href="#">
          <img src="img/logo-flower.svg" alt="" />
          Flowerlover
        </a>
        <nav class="header__nav">
          <a class="header__link" href="#">Головна</a>
          <a class="header__link" href="#">Каталог</a>
          <a class="header__link" href="#">Про нас</a>
          <a class="header__link" href="#">Як замовити</a>
          <a class="header__link" href="#">Відгуки</a>
          <a class="header__link" href="#">Контакти</a>
        </nav>
      </header>

      <section class="hero">
        <div class="hero__content">
          <p class="hero__eyebrow">Неймовірні</p>
          <h1 class="hero__title">БУКЕТИ <span>зі свіжих квітів</span></h1>
          <p class="hero__text">З Доставкою По Києву Протягом 1 Години</p>
          <a class="hero__cta" href="#">Замовити квіти</a>
        </div>

        <div class="hero__photo">
          <img src="img/hero-image.png" alt="Букет рожевих півоній" />
        </div>

        <div class="hero__arc" aria-hidden="true"></div>
      </section>

      <section class="features">
        <article class="features__item">
          <svg class="features__icon" viewBox="0 0 40 40" aria-hidden="true">
            <path d="M14 34 L26 12" />
            <path d="M18 26 Q 12 24 14 18" />
            <path d="M26 12c-3 1-5 4-4 7 3-1 6-3 6-7-2 0-3 1-2 3" />
            <path d="M24 8c2 2 4 5 2 8" />
          </svg>
          <p class="features__text">Щоденне оновлення свіжих квітів</p>
        </article>

        <article class="features__item">
          <svg class="features__icon" viewBox="0 0 40 40" aria-hidden="true">
            <path d="M20 34s-9-9-9-16a9 9 0 1 1 18 0c0 7-9 16-9 16Z" />
            <circle cx="20" cy="18" r="3" />
          </svg>
          <p class="features__text">Безкоштовна доставка в будь яку точку міста</p>
        </article>

        <article class="features__item">
          <svg class="features__icon" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="16" r="10" />
            <ellipse cx="20" cy="16" rx="4" ry="10" />
            <path d="M10 16h20" />
            <circle cx="16" cy="26" r="2.4" />
            <circle cx="24" cy="26" r="2.4" />
            <path d="M11 34c1-5 4-7 9-7s8 2 9 7" />
          </svg>
          <p class="features__text">Більше 1000 сортів квітів з усього світу</p>
        </article>
      </section>
    </div>

    <script src="dist/main.js"></script>
  </body>
</html>
