<!DOCTYPE html>
<html>
<head>
    <title>Opacity</title>
    <script>
        window.addEventListener("load", init, false);
        function init() {
            let canvas = document.getElementById('canvas');
            canvas = canvas.getContext("2d")
            canvas.fillStyle = 'yellow';
            canvas.fillRect(0, 0, 150, 150);
            canvas.fillStyle = 'green';
            // Зелений квадрат прозорий на 25%
            // Інші квардати відображені на повну яскравість
            canvas.globalAlpha = 0.75;          
            canvas.fillRect(150, 0, 150, 150);
            canvas.fillStyle = 'blue';
            canvas.globalAlpha = 1;          
            canvas.fillRect(0, 150, 150, 150);
            canvas.fillStyle = 'red';
            canvas.fillRect(150, 150, 140, 140);
            canvas.fillStyle = 'lightgrey';
            // Код вище, це квадрати для фону
            // Додаємо прозорість колам
            canvas.globalAlpha = 0.25;          
            for (let i = 0; i < 4; i++) {
                canvas.beginPath();
                canvas.arc(150, 150, 10 + 20 * i, 0, Math.PI * 2, true);
                // Заливання дуги
                canvas.fill();
                canvas.lineWidth = 3;
                canvas.stroke();
            }
        }
    </script>
    <style>
        canvas {
            border: 3px solid black;
        }
    </style>
</head>
<body>
    <canvas id="canvas" height="300" width="300">
        Ваш браузер не підтримує елемент <i>Canvas</i>
    </canvas>
</body>
</html>
