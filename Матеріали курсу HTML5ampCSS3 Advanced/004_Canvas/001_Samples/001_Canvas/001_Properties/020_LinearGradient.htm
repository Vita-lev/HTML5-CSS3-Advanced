<!DOCTYPE html>
<html>

<head>
    <title>LinearGradient</title>
    <script>
        window.addEventListener("load", init, false);

        function init() {
            let canvas = document.getElementById('canvas');
            let context = canvas.getContext('2d');

            // Створюємо масив кольорів для колірної моделі
            let hue = [
                    [255, 0, 0],
                    [255, 255, 0],
                    [0, 255, 0],
                    [0, 255, 255],
                    [0, 0, 255],
                    [255, 0, 255]
                ],
                gradient = context.createLinearGradient(0, 0, canvas.width, canvas.height);
            // Додаємо кольори зупинки
            for (let i = 0; i <= 5; i++) {
                color = 'rgb(' + hue[i][0] + ', ' + hue[i][1] + ', ' + hue[i][2] + ')';
                gradient.addColorStop(i * 1 / 6, color);
            }
            // Робимо заливання контексту
            context.fillStyle = gradient;
            // Поставити ширину та висоту по 300!
            context.fillRect(5, 5, 200, 100);

        }
    </script>
    <style>
        canvas {
            border: 3px solid black;
        }
    </style>
</head>

<body>
    <canvas id="canvas" height="300" width="300">
        Ваш браузер не підтримує елемент <i>Canvas</i>
    </canvas>
</body>

</html>
