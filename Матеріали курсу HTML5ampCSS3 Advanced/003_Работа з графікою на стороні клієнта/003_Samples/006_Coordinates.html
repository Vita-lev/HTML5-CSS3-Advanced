<!DOCTYPE html>
<html>
<head>
    <title></title>
    <style>
        body{
            padding: 100px;
        }
        svg{
            border: 2px solid rgb(16, 50, 188);
            margin-bottom: 10px;
            width: 300px;
            height: 180px;
        }
    </style>
</head>
<body>
    <!--Елемент <path> використовується визначення шляху.

        Для цих шляхів доступні такі команди:
        М = Початок лінії
        L = Продовження лінії
        H = Горизонтальна лінія
        V = Вертикальна лінія
        Z = Закрити фігуру, з'єднати останню крапку з першою
    -->
    <!-- Координати Х,У починається з верхнього лівого кута елемента svg -->
    <h2>Горизонтальна лінія (H,h) и вертикальна (V,v)</h2>
    <!-- Визначення координат навіть із неправильним значенням малює лінії
         горизонтально та вертикально! Завершуючи шлях "Z", вона можлива від заданої
         фігури лінія навскіс -->
    <h3>Абсолютні координати</h3>
    <svg>
        <path 
        fill="none"
        stroke="brown" 
        stroke-width="10" 
        d="M 20 20 V 70 H 70 V 120 H 120 V 70 H170 V 20 Z">
    </svg>
    <h3>Відносні координати</h3>
    <svg>
        <path 
        fill="none"
        stroke="brown" 
        stroke-width="10" 
        d="M 20 20 v 50 h 50 v 50 h 50 v -50 h50 v -50 Z">
    </svg>
</body>
</html>
