<!DOCTYPE html>
<html>

<head>
    <title></title>
    <style>
        body{
            padding: 100px;
        }
        svg{
            border: 2px solid rgb(16, 50, 188);
            width: 300px;
            height: 300px;
        }
        .line-element{
            /* Звичайні стилі на svg не працюють! */
            color: red;
            background-color: red;
            width: 10000px;
            height: 10000px;
            /* Записи атрибутів можна вказати у css */
            stroke: blue; 
            stroke-width:20;
        }
    </style>
</head>

<body>
    <svg width="200" height="200">
        <!-- stroke, stroke-width можна додавати й іншим фігурам для створення та стилізації рамки -->
        <rect x="20" y="20" width="200" height="200" fill="#41d75f" stroke="#ab24e1" stroke-width="5"/>
    </svg>
    <br>
    <svg width="230" height="140">
        <!-- Лінія стилізована через правила записані у css -->
        <line x1="220" y1="10" x2="20" y2="130" class="line-element" />
    </svg>
    <br>
    <svg width="230" height="150">
         <ellipse rx="110" ry="70" cx="55" cy="75" fill="#1032bc" stroke="gold" stroke-width="7"/>
    </svg>
    <br>
    <svg width="260" height="140">
        <!-- stroke-linejoin: miter | round - малювання стиків ліній -->
        <polyline points="15,135 30,25 55,135 80,25, 105,135 130,25, 155,135 180,25, 205,135 230,25, 255,135" fill="none" stroke="black" stroke-width="10" stroke-linejoin="round"/>
    </svg>
    
</body>

</html>
