<!DOCTYPE html>
<html>
<head>
    <title></title>
</head>
<body>
    <style>
        p{
            color: #008faf;
        }
    </style>
    <svg width="100" height="150">
        <!-- linearGradient - налаштування градієнта, 
                              сам елемент не відображається на сторінці -->
        <!-- linearGradient - підключається через id до заливання прямокутника -->
        <linearGradient id="gradient">
          <!-- <stop offset="0%" stop-color="#00ff00"></stop>
          <stop offset="100%" stop-color="#ff0000"></stop> -->
          <!-- ---------------------------- -->
          <!-- offset атрибут визначає точку ширини елемента, де буде колір -->
          <!-- При такому записі з 0% по 20% йде яскравий зелений,
                з 20% по 70% градієнт (перехід із зеленого на червоний),
                і з 70% по 100% ширини фігури яскравий червоний -->
          <stop offset="20%" stop-color="#00ff00"></stop>
          <stop offset="70%" stop-color="#ff0000"></stop>
        </linearGradient>
        <!-- fill="url(#gradient)" прив'язка до linearGradient -->
        <rect x="0" y="0" width="100" height="150" fill="url(#gradient)"/>
    </svg>
    <br>
    <br>
    <svg width="100" height="100">
        <radialGradient id="gradientCircle">
            <!-- Переходів stop можна ставити скільки завгодно -->
          <stop offset="0%" stop-color="#eded0b"></stop>
          <stop offset="50%" stop-color="#c62e2e"></stop>
          <stop offset="100%" stop-color="#008faf"></stop>
        </radialGradient>
         <circle r="50" cx="50" cy="50" fill="url(#gradientCircle)"/>
    </svg>
    <br>
    <br>
    <svg>
        <linearGradient id="gradientPolygon">
            <!-- offset вказується з меншого числа до більшого -->
            <!-- без проміжків у offset буде різкий перехід -->
          <stop offset="0%" stop-color="purple"></stop>
          <stop offset="20%" stop-color="red"></stop>
          <stop offset="20%" stop-color="gold"></stop>
          <stop offset="70%" stop-color="green"></stop>
          <stop offset="70%" stop-color="aqua"></stop>
        </linearGradient>
        <polygon points="70,5 100,5 125,70 125,70 100,105 50,105 25,80 25,30" fill="url(#gradientPolygon)"/>
    </svg>
    
</body>
</html>
