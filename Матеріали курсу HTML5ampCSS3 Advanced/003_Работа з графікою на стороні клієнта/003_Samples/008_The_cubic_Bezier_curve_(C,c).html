<!DOCTYPE html>
<html>

<head>
    <title></title>
    <style>
        body {
            padding: 100px;
        }

        svg {
            border: 2px solid rgb(16, 50, 188);
            margin-bottom: 10px;
            width: 400px;
            height: 400px;
        }
    </style>
</head>

<body>
    <h2>The cubic Bezier curve (C,c)</h2>
    <h3>Абсолютні координати</h3>
    <svg>
        <!-- Змінюйте значення відразу у двох параметрів path і circle-лів щоб розуміти
             як тягне лінію напрямні точки -->
        <!--                 X👇  Y👇 -->
        <path d="M 100 100 C 0 200 200 400, 300 300" stroke="blue" stroke-width="5" fill="none" />
        <!--Верхня точка  X👇     Y👇 -->
        <circle r="10" cx="0" cy="200" />
        <!--Нижня точка   X👇      Y👇 -->
        <circle r="10" cx="200" cy="400" />
    </svg>
    <br>
    <h3>Відносні координати</h3>
    <svg>
        <!-- Змінюйте значення відразу у двох параметрів path і circle щоб розуміти як
             тягне лінію напрямна точка -->
        <!-- У цьому прикладі значення circle
                має бути на 100 більше ніж у path -->
        <!--                 X👇  Y👇 -->
        <path d="M 100 100 c 100 300 100 100, 200 200" stroke="blue" stroke-width="5" fill="none" />
        <!--                X👇   Y👇 -->
        <circle id="c" r="10" cx="30" cy="30" />
        <circle id="b" r="10" cx="20" cy="20" />
        <circle id="a" r="10" cx="10" cy="10" />
    </svg>
    <br>
    

</body>

</html>
