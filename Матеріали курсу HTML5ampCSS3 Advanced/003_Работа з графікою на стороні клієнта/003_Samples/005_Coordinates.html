<!DOCTYPE html>
<html>
<head>
    <title></title>
    <style>
        body{
            padding: 100px;
        }
        svg{
            border: 2px solid rgb(16, 50, 188);
            margin-bottom: 10px;
            width: 300px;
            height: 300px;
        }
    </style>
</head>
<body>
    <!--Команди позначаються однією літерою і вказуються у верхньому або нижньому регістрі. 
        Верхній регістр - абсолютні координати,
        Нижній регістр - відносні
    -->
    <!-- Абсолютні координати - обчислюються з верхнього лівого кута елемента svg -->
    <!-- Відносні координати - обчислюються з останньої точки, що була задана при 
        побудові фігури -->
    <h3>Абсолютні координати</h3>
    <svg>
        <!-- Усі координати працюють від верхнього лівого кута svg -->
        <path fill="none" 
        stroke="brown" 
        stroke-width="10" d="M0 0 L100 100 M110 100 L150 80"></path>
    </svg>
    <br>
    <h3>Відносна координата "m"</h3>
    <svg>
        <!-- Позиція точки "m" обчислюється з координат попередньої точки -->
        <!-- Крапка "m" розташована внизу! Лінія відмальована знизу нагору! -->
        <path fill="none" 
        stroke="brown" 
        stroke-width="10" d="M0 0 L100 100 m110 100 L150 80"></path>
    </svg>
    <br>
    <h3>Відносні координати "m,l"</h3>
    <svg>
        <!-- Точка "l" виходить за межі svg елемента і за ними фігури не видно повністю! -->
        <!-- Лінія відмальована зліва направо -->
        <path fill="none" 
        stroke="brown" 
        stroke-width="10" d="M0 0 L100 100 m110 100 l150 80"></path>
    </svg>
    
    
</body>
</html>
