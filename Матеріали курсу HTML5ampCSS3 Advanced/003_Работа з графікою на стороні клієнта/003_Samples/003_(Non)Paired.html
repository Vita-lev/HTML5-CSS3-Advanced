<!DOCTYPE html>
<html>

<head>
    <title></title>
    <style>
        body{
            padding: 100px;
        }
        svg{
            border: 2px solid gray;
            width: 300px;
            height: 300px;
        }
    </style>
</head>

<body>
    <!-- Технологія svg це не HTML! хоч її можна прописати в хтмл коді -->
    <svg>
        <!-- SVG інша технологія! прописавши фігуру одиночним тегом без слєшу "/",
             код не працюватиме -->
        <!-- Розкоментуйте код нижче!!! -->
        <!-- <circle r="20" cx="100" cy="100"> -->
        <!-- Парний елемент -->
        <circle r="20" cx="200" cy="200"></circle>
        <!-- Поодинокий елемент -->
        <circle r="20" cx="100" cy="100" />
        <line x1='130' y1="160" x2="10" y2="10" stroke-width="5" stroke="blue"></line>
        <line x1='80' y1="200" x2="170" y2="210" stroke-width="5" stroke="blue">
    </svg>
    <br>
    
</body>

</html>
