<!DOCTYPE html>
<html>

<head>
    <title></title>
    <style>
        body {
            padding: 100px;
        }

        svg {
            border: 2px solid rgb(16, 50, 188);
            margin-bottom: 10px;
            width: 400px;
            height: 400px;
        }
    </style>
</head>

<body>
    <h2>Quadratic Bezier Curves (Q,q)</h2>
    <h3>Абсолютні координати</h3>
    <svg>
        <path d="M10,100 Q100,25 200,100 Q200 180 290 100" 
         style="stroke:blue; stroke-width:4; fill:none;"/>
        <!--Крапка вгорі зліва 
                          X👇      Y👇 -->
        <circle r="10" cx="100" cy="25" />
        <!--Крапка внизу правіше 
                           X👇      Y👇 -->
        <circle r="10" cx="200" cy="180" />
    </svg>
    

</body>

</html>
