<!DOCTYPE html>
<html>
<head>
    <title></title>
    <style>
        body{
            padding: 100px;
        }
        svg{
            border: 2px solid rgb(16, 50, 188);
            margin-bottom: 10px;
            width: 300px;
            height: 180px;
        }
    </style>
</head>
<body>
    
    <!--Елемент <path> використовується визначення шляху.

        Для цих шляхів доступні такі команди:
        М = Початок лінії
        L = Продовження лінії
        H = Горизонтальна лінія
        V = Вертикальна лінія
        Z = Закрити фігуру, з'єднати останню крапку з першою
    -->
    <!-- Координати Х,У починається з верхнього лівого кута елемента svg -->
      
    <!-- У наведеному нижче прикладі визначається шлях,
         (M) який починається в позиції 100,10 з точки (L) до позиції 100,150,
         потім звідти йде (L) лінія до 200,150 і нарешті
         (Z) замикається шлях назад у 100,0: -->
    <svg>
        <path d="M100 10 L100 150 L200 150">
    </svg>
    <br>
    <!-- У наведеному нижче прикладі визначається шлях,
         (M) який починається в позиції 50,40 з точки (L) до позиції 250,10,
         потім звідти йде (L) лінія до 150,150 і нарешті
         (Z) замикається шлях назад у 100,0: -->
    <svg>
        <path d="M50 40 L250 10 L150 150">
    </svg>
    <br>
    <svg>
        <!-- для fill доступно значення none -->
        <path 
        fill="#ccc" 
        stroke="red" 
        stroke-width="10" 
        d="M100 10 L100 150 L200 150">
        <!-- ☝☝☝ Наприкінці координат дописати Z  -->
    </svg>
    <br>
    <svg>
        <!-- M(moveto) – початок нової лінії, точка з якої починається лінія.
         M у рядку може бути декілька і кожна нова буде позначати початок нової лінії -->
        <path 
        fill="none" 
        stroke="brown" 
        stroke-width="10" 
        d="M100 10 L100 150,
           M200 40 L 230 150,
           M 200 20 L 290 20
           ">
    </svg>
    <br>
    <!-- Тег style пишеться тільки у head!
          style не пишіть у середині body! -->
    <style>
        .figure{
            /* Шляхи точок можна прописувати через CSS */
            d: path("M400  10 L100 150,M200 40 L 230 150, M 200 20 L 290 20");
            fill: none; 
            stroke:rgb(111, 0, 128);
            stroke-width:20; 
            /* Усі атрибути для SVG елементів можна переносити до CSS правил */
            /* Один із способів створювати анімацію для SVG */
            transition: .5s;
        }
        svg:hover .figure{
            d: path("M100 150 L200 150,M150 40 L 200 150, M 150 20 L 100 150");
            stroke:rgb(0, 6, 128);
        }
    </style>
    <svg>
        <path class="figure">
    </svg>
    
</body>
</html>
