<!DOCTYPE html>
<html>

<head>
    <title>transition-timing-function</title>
    <meta charset="utf-8" />
    <style>
        .block-linear,
        .block-ease,
        .block-ease-in,
        .block-ease-out {
            width: 150px;
            height: 150px;
            background-color: #00ff90;
            transition-property: width;
            transition-duration: 4s;
            margin: 5px;
        }

        .block-linear {
            transition-timing-function: linear;
        }

        .block-ease {
            transition-timing-function: ease;
        }

        .block-ease-in {
            transition-timing-function: ease-in;
        }

        .block-ease-out {
            transition-timing-function: ease-out;
        }

        .container:hover .block-linear,
        .container:hover .block-ease,
        .container:hover .block-ease-in,
        .container:hover .block-ease-out {
            width: 750px;
        }
        .container{
            border: 1px solid #000;
            padding: 5px;
            width: 800px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="block-linear">Лінійна функція</div>
        <div class="block-ease">Повільний старт, потім прискорення та уповільнення в кінці</div>
        <div class="block-ease-in">Повільний старт</div>
        <div class="block-ease-out">Уповільнення наприкінці</div>
    </div>
</body>

</html>
