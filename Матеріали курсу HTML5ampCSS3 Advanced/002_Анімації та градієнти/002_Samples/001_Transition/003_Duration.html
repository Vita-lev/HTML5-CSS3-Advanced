<!DOCTYPE html>
<html>

<head>
    <title>transition-duration</title>
    <meta charset="utf-8" />
    <style>
        .block {
            width: 150px;
            height: 150px;
            background-color: #00ff90;
            /*Властивість переходу*/
            /* transition: all 1s; */
            /* transition-property: width; */
            /*Тривалість переходу*/
            /* transition-duration: 1s; */
            transition: width 1s;
        }

        .block:hover {
            width: 250px;
            background-color: #0a0af0;
        }
    </style>
</head>

<body>
    <div class="block"></div>
</body>

</html>
