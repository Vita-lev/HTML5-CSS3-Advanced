<!DOCTYPE html>
<html>

<head>
    <title>matrix</title>
    <meta charset="utf-8" />
    <style>
        div {
            width: 200px;
            height: 160px;
            background-color: rgba(239, 181, 181, 0.61);
            font-size: 12px;
            color: #808080;
            margin: 50px;
            float: left;
        }
        
        img {
            width: 200px;
            height: 160px;
            opacity: 0.8;
        }
        
        img:active {
            /*matrix(a, b, c, d, x, y)
                   a - масштаб по горизонталі,
                   b - деформує (зсуває) сторони елемента по осі X
                   c - деформує (зсуває) сторони елемента по осі Y
                   d – змінює масштаб по вертикалі
                   x - зміщує елемент по осі X
                   y - зміщує елемент осі Y;
                   transform: matrix(scaleX,skewX,skewY,scaleY,translateX,translateY)*/
            transform: matrix(1.5, 0, 0.5, 1.5, 70, 20)
        }
    </style>
</head>

<body>
    <div>
        <img src="Auto.jpg" />
    </div>


</body>

</html>
