<!DOCTYPE html>
<html>

<head>
    <title>rotate</title>
    <meta charset="utf-8" />
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        div {
            width: 300px;
            height: 100px;
            font-size: 25px;
            color: #808080;
            margin: 50px;
            float: left;
            transition: 4s;
        }
        .block{
            background-color: lightblue;
        }
        .block-rotate1:active {
            /*rotate - повертає елемент на різні кути*/
            transform: rotate(1145deg);
        }

        .block-rotate2:active {
            transform: rotate(-55deg);
        }

        .element {
            display: inline-block;
            height: 100px;
            width: 100px;
            color: black;
            text-align: center;
            opacity: .7;
            font-family: Verdana, sans-serif;
            border: 3px solid rgba(0, 0, 0, .3);
            margin-bottom: 30px;
            transition: all 2.2s linear;
        }

 

        .one:active {
            transform: rotateX(180deg);
        }
        .one {
            background-image: url('1.png');
            background-size: contain;
        }

        
        .two:active {
            transform: rotateY(180deg);
        }
        .two {
            background-image: url('2.png');
            background-size: contain;
        }

        .three {
            background-image: url('3.png');
            background-size: 100% 100%;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: flex-end;
        }
        .three:active {
            transform: rotateZ(180deg);
        }

        .four:active {
            /*Функція обертає елемент відносно трьох осей*/
            transform: rotate3d(3, 4, 2, -60deg);
        }
    </style>
</head>

<body>
    <div class="block block-rotate1">Rotate(45deg)</div>
    <div class="block block-rotate2">Rotate(-15deg)</div>

    <div class="element one">
        RotateX
    </div>
    <div class="element two">
        RotateY
    </div>
    <div class="element three">
        RotateZ
    </div>
    <div class="element four">
        Rotate3D
    </div>


    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
</body>

</html>
