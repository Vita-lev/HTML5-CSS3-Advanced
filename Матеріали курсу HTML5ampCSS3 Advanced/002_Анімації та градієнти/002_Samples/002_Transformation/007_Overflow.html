<!DOCTYPE html>
<html>

<head>
    <title>overflow</title>
    <meta charset="utf-8" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }
        
        html,
        body {
            height: 100%;
        }
        
        body {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }
        
        figure {
            width: 500px;
            position: relative;
            /* Властивість overflow управляє відображенням вмісту блочного елемента, якщо воно цілком не міститься і виходить за область заданих розмірів */
            /* Відновити рядок коду нижче👇 (overflow)  */
            /* overflow: hidden; */
            border: 2px solid #000;
        }
        
        figure img {
            display: block;
            width: 100%;
            transition: 0.5s;
            position: relative;
            z-index: -1;
        }
        
        figcaption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, .7);
            padding: 20px;
            text-align: center;
            opacity: 0;
            transform: translateY(100%);
            transition: 0.5s;
        }
        
        figure:hover figcaption {
            opacity: 1;
            transform: translateY(10px);
        }
        
        figure:hover img {
            transform: scale(1.3);
        }
    </style>
</head>

<body>
    <figure>
        <img src="Auto.jpg" alt="car" />
        <figcaption>
            <h4>
                Ferrari S.p.A. (коротко: Ferrari - рус. "Феррарі") - італійська компанія, що випускає спортивні та гоночні автомобілі, заснована в 1928 році Енцо Феррарі.
            </h4>
        </figcaption>
    </figure>
</body>

</html>
