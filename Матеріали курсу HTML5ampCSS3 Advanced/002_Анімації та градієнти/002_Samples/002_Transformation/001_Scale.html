<!DOCTYPE html>
<html>
<head>
    <title>scale</title>
    <meta charset="utf-8" />
    <style>
        div {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            font-size: 25px;
            color: #808080;
            margin: 30px;
        }
        .blocks{
            display: flex;
        }

        .block-scaleX:hover {
            /*scale - збільшує або зменшує елемент по осі Х*/
            transform: scaleX(0.7);
        }
        .block-scaleY:hover {
            /*scale - збільшує або зменшує елемент по осі У*/
            transform: scaleY(0.7);
        }
        .block-scale1:hover {
            /*scale - збільшує або зменшує елемент */
            transform: scale(0.7);
        }

        .block-scale2:hover {
            transform: scale(1.5);
        }

        .block-scale3:hover {
            transform: scale(2, 1);
        }

        .block-scale4:hover {
            transform: scale(1, 2);
        }
        .block-scale5 {
            transition: transform 2s ease-in-out;
        }
        
        .block-scale5:hover {
            /*Функція задає операцію тривимірного масштабування за вектором*/
            transform: scale(-1, 1);
        }
        .block-scale6:hover {
            /*Функція задає операцію тривимірного масштабування за вектором*/
            transform: scale(1, -1);
        }
    </style>
</head>
<body>
    <section class="blocks">
        <div class="block-scaleX">ScaleX 0.7</div>
        <div class="block-scaleY">ScaleY 0.7</div>
        <div class="block-scale1">Scale 0.7</div>
        <div class="block-scale2">Scale 1.5</div>
        <div class="block-scale3">Scale (2, 1)</div>
        <div class="block-scale4">Scale(1, 2)</div>
    </section>
    <img class="block-scale5" src="../002_Transformation/Auto.jpg" />
    <hr>
    <img class="block-scale6" src="../002_Transformation/Auto.jpg" />
</body>
</html>
