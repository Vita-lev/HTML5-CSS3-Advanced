<!DOCTYPE html>
<html>

<head>
    <title>transform-origin</title>
    <meta charset="utf-8" />
    <style>
        div {
            width: 200px;
            height: 160px;
            background-color: rgba(239, 181, 181, 0.61);
            font-size: 12px;
            color: #808080;
            margin: 50px;
            float: left;
            position: relative;
        }

        img {
            width: 200px;
            height: 160px;
        }

        #first::before,
        #second::before {
            content: '';
            position: absolute;
            z-index: 5;
            background-image: url('4.png');
            background-size: 100% 100%;
            width: 20px;
            height: 20px;
        }
        #first::before{
            top: 50px;
            left: 50px;
        }
        #second::before {
            top: 80%;
            left: 80%;
        }

        /* Властивість дозволяє змістити центр трансформації, відносно якого відбувається зміна положення/розміру/форми елемента */
        #first img {
            transform-origin: 50px 50px;
        }


        #second img {
            transform-origin: 90% 90%;
        }

        #first:active img,
        #second:active img {
            transform: rotate(45deg);
        }
    </style>
</head>

<body>
    <div id="first">
        <img src="Auto.jpg" />
    </div>
    <div id="second">
        <img src="Auto.jpg" />
    </div>

</body>

</html>
